[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kumi"
dynamic = ["version"]
description = "A configurable launcher for applications and scripts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5"]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

[project.gui-scripts]
kumi = "kumi.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kumi = ["main.qml", "icons/*.svg"]

[tool.setuptools.dynamic]
version = {attr = "kumi.__version__"}

[tool.setuptools.data-files]
"share/applications" = ["data/applications/kumi.desktop"]
"share/icons/hicolor/scalable/apps" = ["src/kumi/icons/kumi.svg"]
"share/icons/hicolor/symbolic/apps" = ["src/kumi/icons/kumi-symbolic.svg"]
