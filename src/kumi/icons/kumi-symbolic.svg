<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="64" height="64" viewBox="0 0 64 64">
  <title>Kumi</title>
  <desc>Symbolic monochrome icon for Kumi custom menus: a menu panel with configurable entries.</desc>
  <g fill="none" stroke="currentColor" stroke-width="3.5"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- Menu panel -->
    <rect x="7" y="8" width="50" height="48" rx="5"/>
    <!-- Header -->
    <path d="M7 20h50"/>
    <circle cx="14" cy="14" r="1.1" fill="currentColor" stroke="none"/>
    <circle cx="19" cy="14" r="1.1" fill="currentColor" stroke="none"/>
    <circle cx="24" cy="14" r="1.1" fill="currentColor" stroke="none"/>
    <!-- Menu entries -->
    <path d="M17 29h29M17 39h29M17 49h19"/>
    <rect x="11.5" y="26.5" width="3.5" height="5" rx="1" fill="currentColor" stroke="none"/>
    <rect x="11.5" y="36.5" width="3.5" height="5" rx="1" fill="currentColor" stroke="none"/>
    <rect x="11.5" y="46.5" width="3.5" height="5" rx="1" fill="currentColor" stroke="none"/>
  </g>
</svg>
